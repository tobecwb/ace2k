# ace2k — the spool brands the host decodes.  Include it from
# printer.cfg with [include ace2k_tags.cfg].  Each section: enabled, the source the parameters
# were published in, the brand's parameters.  A new brand: a module in klippy/extras/ace2k_tags/
# and a section here.  The firmware carries none of these values.

[ace2k_tag anycubic]
enabled: True
source: https://github.com/DnG-Crafts/ACE-RFID

[ace2k_tag elegoo]
# not yet checked against a real tag: enable at your own risk, or report a dump
enabled: False
source: https://github.com/elegooofficial/ELEGOO-RFID-Tag-Guide

[ace2k_tag bambu]
enabled: True
source: https://github.com/Bambu-Research-Group/RFID-Tag-Guide
hkdf_salt: 9a759cf2c4f7caff222cb9769b41bc96
# "RFID-A" and a NUL, in hex
hkdf_info: 524649442d4100

[ace2k_tag snapmaker]
enabled: True
source: https://github.com/Snapmaker/u1-klipper
salt_a: Snapmaker_qwertyuiop[,.;]

[ace2k_tag creality]
# not yet checked against a real tag: enable at your own risk, or report a dump
enabled: False
source: https://github.com/DnG-Crafts/K2-RFID
# AES-128 keys, hex
uid_key: 713362755e74316e71665a2870662431
data_key: 484043466b526e7a404b4174424a7032
# optional: filament id = name, one per line
#materials:
#    101001 = Hyper PLA
