# ace2k — a printer.cfg snippet for the Anycubic ACE 2 Pro running ace2k (docs/README.md).
# The unit as a Klipper MCU, the [ace2k] host module, the three temperatures as sensors.

[mcu ace2k]
serial: /dev/serial/by-id/<the unit's USB adapter>
baud: 250000
restart_method: command

[ace2k]
#uid: <the unit's UID>         # optional; refuse another unit on this serial: (ACEK_STATUS shows it)
#lane1_insert_mv: 600, 1100    # optional; the factory calibration is used when absent
#feed_speed: 30                # mm/s, the default of ACEK_FEED and ACEK_ROLLBACK
#unload_speed: 80             # mm/s; left out: 80, or the unit's top speed when lower
#load_speed: 60
#load_park_mm: 300             # the load's parking distance: the path from the drive to the outlet
#                              # (323 mm on the development unit) minus a margin
#auto_load: True               # pull a filament in to the parking point when it is inserted
#assist_speed: 50
#slip_check_mm: 50             # the supervisors' thresholds; an absent key leaves the firmware's
#slip_allow_mm: 15
#stall_check_mm: 20            # slip_check_mm and stall_check_mm under 100 mm, an assist's burst
#snag_fwd_mm: 20               # the tip snag: motor past a full before the touch (5–50)
#snag_lag_mm: 5                # the filament behind the motor that is a jam (1–20, under fwd)
#snag_duty_pct: 0              # the duty above the feed-forward that is a jam (0 off, 0–100)
#snag_back_mm: 5               # the touch (2–20)
#snag_rest_ms: 500             # the wait for the plunger at rest (100–2000)
#snag_free_mm: 50              # reverse: the filament back before a taut trip is forgiven (20–200)
#held_mm: 3                    # the held stop: the filament moving this much is not held (1.5–20)
#held_ms: 550                  # the held stop: the plunger pulled tight this long (50–2000)
#follow_default: True          # arm the follow on every lane with filament, at Klipper's start and
#                              # after an insertion; False: only ACEK_ASSIST DIR=BOTH (or an adapter)
#follow_lanes: all             # which lanes follow_default arms: all; extruder: only a lane that
#                              # feeds an extruder (laneN_extruder below, or an adapter's map)
#follow_flip_ms: 200           # the follow: the wait before a move against the last one (50–2000)
#follow_take_mm: 15            # the follow's take-up on this lane's full (5–30)
#follow_tail_mm: 2000          # the follow's tail: motor after a runout before it ends (200–2000)
#lane1_extruder: extruder      # the feed-forward: the extruder lane 1 feeds (lane1..lane4; several
#                              # lanes may name one: ACEK_LANE_ACTIVE picks the one followed); a
#                              # lane without one has no feed-forward
#feed_forward: True            # ACEK_FEED_FORWARD ON=1 / OFF=1 switches it live
#ff_chunk_mm: 3                # the unit's dose (1–10)
#ff_pulse: 15                  # retired, the next version removes it: mm/s, a reverse dose's
#                              # least speed (9–70); a forward dose runs at the floor speed
#ff_period_ms: 100             # how often the host works out the rate (20–1000)
#ff_window_ms: 500             # the stretch of planned moves the rate is the mean of (100–5000)
#ff_lead_ms: 0                 # how far ahead of now that stretch starts (0–5000)
#ff_deadband: 0.3              # mm/s: a smaller change of the rate is not sent (0–10)
#ff_retract_min_mm: 10         # mm: a contiguous retraction this long or more is taken back (5–17)
#ff_notice_every: 20           # corrections one way before a console notice (1–10000)
#lane1_encoder_scale: 1.2342   # mm per encoder count, lane1..lane4 (ACEK_CALIBRATE_ENCODER)
#feed_report_hz: 1             # 0.05–10 Hz; 1, 2, 5 and 10 are exact, the rest snap to the 100 ms grid
#rfid_search_mm: 750          # the load's search for a spool's tag past the parking point,
#                             # 100–1000 mm of filament
#rfid_mifare_order: bambu, snapmaker, creality
#heater_watts: 360            # the dryer's heater power, for ACEK_DRYER_LOG's energy (≈ 340–380 W
#                             # measured at 127 V, docs/hardware.md "Heater")
#unattended_drying: False     # allow the humidity mode (ACEK_DRY_MODE): the unit then heats on its
#                             # own, with the printer off, for days or months
#dry_humidity_limit: 40       # the box's RH, %, at or above which the automatic modes dry (5–95)
#dry_max_failures: 4          # failed cycles in a row that stop the humidity mode (1–20)
#bench_dry_cycle_minutes:     # bench only, unset in normal use: the automatic cycle's time
#bench_dry_hold_s:            # bench only: the hold at or above the limit (default 1800)
#bench_dry_cold_window_s:     # bench only: the cold box's window (default 1800)
#bench_dry_link_s:            # bench only: a bound cycle's link time (default 300)

[include ace2k_tags.cfg]

# Each sensor's name says which unit it reads: Fluidd and Mainsail show it as "Ace A Chamber".
# A lone [ace2k] has no name, so its sensors use a. They keep their names when you add unit b.
[temperature_sensor ace_a_ptc_left]
sensor_type: ace2k
sensor: ptc_left

[temperature_sensor ace_a_ptc_right]
sensor_type: ace2k
sensor: ptc_right

[temperature_sensor ace_a_chamber]
sensor_type: ace2k
sensor: chamber

# On a Klipper older than the one ace2k's image is built from (the Snapmaker U1's, paxx extended
# firmware v1.6.0-paxx12-22), comment this section out: Klipper's generic analog-in query has
# another format there, and Klipper stops with "Unable to encode: query_analog_in". The three
# temperatures above come from ace2k's own report and are unaffected (ace2k-u1's docs/install.md).
[temperature_sensor ace_mcu]
sensor_type: temperature_mcu
sensor_mcu: ace2k

# Several units: name each section, and give each its own [mcu] (one USB connection per unit).
# [ace2k] and [ace2k <name>] cannot be mixed. A name holds only letters, digits, _ and -.
# [temperature_sensor ace_mcu] above names [mcu ace2k]: set its sensor_mcu: to ace2k_a, or
# comment that section out.
# Put every unit section before the sensors: the unit sections below replace [mcu ace2k] and
# [ace2k] above, and each sensor takes unit: (the three above take unit: a).
# Commands then take UNIT=a or UNIT=b (docs/commands.md "Several units").
#[mcu ace2k_a]
#serial: /dev/serial/by-id/<unit a's USB adapter>
#baud: 250000
#restart_method: command
#[ace2k a]
#mcu: ace2k_a              # required in a named section
#uid: <unit a's UID>       # recommended: refuses unit b if the two cables are swapped
#[mcu ace2k_b]
#serial: /dev/serial/by-id/<unit b's USB adapter>
#baud: 250000
#restart_method: command
#[ace2k b]
#mcu: ace2k_b
#uid: <unit b's UID>
#[temperature_sensor ace_b_ptc_left]
#sensor_type: ace2k
#unit: b                   # required with several units
#sensor: ptc_left
#[temperature_sensor ace_b_ptc_right]
#sensor_type: ace2k
#unit: b
#sensor: ptc_right
#[temperature_sensor ace_b_chamber]
#sensor_type: ace2k
#unit: b
#sensor: chamber
