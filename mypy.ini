# mypy --strict on every host module (klippy/extras, ace2k_tags included, and scripts) and on the
# firmware tools.
[mypy]
# mypy 2.4 refuses 3.9; ruff's target-version stays py39, the syntax floor
python_version = 3.10
strict = True
warn_unreachable = True
# klippy as the base: the host modules are the package `extras` (as Klipper imports them), so a
# relative import resolves; the bare-name fallback the host tests use is the one ignored
mypy_path = klippy
explicit_package_bases = True
namespace_packages = True
files = klippy/extras, scripts, firmware/tools

# Klipper's own module, present only on the printer
[mypy-msgproto]
ignore_missing_imports = True
