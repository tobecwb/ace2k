name: Bug
description: Something does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A problem with the heater, the fans, the motors or flash is a safety problem.
        Report it privately instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: ace2k version
      description: The release tag, or `git describe` for a build from source.
    validations:
      required: true
  - type: input
    id: klipper
    attributes:
      label: Klipper version and printer
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The steps, the commands sent, what the unit did and what you expected.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Klipper log
      description: The relevant part of klippy.log. Remove serial numbers and unit IDs.
      render: text
